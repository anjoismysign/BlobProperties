World:
  Not-Found:
    Title: '&c&lNOT FOUND'
    Subtitle: '&7World not found'
Door:
  Added:
    Title: '&f&lDONE!'
    Subtitle: '&7Door has been added'
  Removed:
    Title: '&f&lDONE!'
    Subtitle: '&7Door has been removed'
Container:
  Added:
    Title: '&f&lDONE!'
    Subtitle: '&7Container has been added'
  Removed:
    Title: '&f&lDONE!'
    Subtitle: '&7Container has been removed'
Property:
  Purchased:
    Title: '&a&lBOUGHT!'
    Subtitle: '&7Property bought for &r%price%'
    BlobSound: Property.Purchased
  Sold:
    Title: '&a&lSOLD!'
    Subtitle: '&7Property sold for &r%price%'
    BlobSound: Property.Sold
  Denied:
    Title: '&c&lDENIED'
    Subtitle: '&7You need %left% more'
    BlobSound: Property.Denied
  Already-Owner:
    Title: '&c&lDENIED'
    Subtitle: '&7You already own this property'
    BlobSound: Property.Already-Owner
  Not-Owner:
    Title: '&c&lDENIED'
    Subtitle: '&7You do not own this property'
    BlobSound: Property.Not-Owner
  Not-Enough-Money:
    Title: '&c&lOOPS!'
    Subtitle: '&7Not enough money!'
    BlobSound: Property.Not-Enough-Money
Builder:
  Price:
    Title: '&f&lTYPE IN PRICE'
    Subtitle: '&7It can include decimals'
  Price-Timeout:
    Title: '&c&lTIMEOUT'
    Subtitle: '&7You took too long to type in a price'
    BlobSound: Builder.Timeout
  PropertyDisplayName:
    Title: '&f&lDISPLAY-NAME'
    Subtitle: '&7This will be used in "en_us" locale'
  PropertyDisplayName-Timeout:
    Title: '&c&lTIMEOUT'
    Subtitle: '&7You took too long to type in a display name'
    BlobSound: Builder.Timeout
BlobProprietor:
  Not-Inside-Property:
    Chat: '&c&lERROR: &7You are not inside a property'
    BlobSound: System.Alert
  Not-Inside-Own-Property:
    Chat: '&c&lERROR: &7You are not inside your own property'
    BlobSound: System.Alert
  Not-Inside-Cache:
    Chat: '&c&lERROR: &7You are not inside the cache (maybe not yet)'
    BlobSound: System.Alert
  Not-Inside-Cache-Others:
    Chat: '&c&lERROR: &7%player% is not inside the cache (maybe not yet)'
    BlobSound: System.Alert
  Invited:
    Chat: '&a&lINVITED: &7%player% has been invited to your property'
    BlobSound: BlobProprietor.Invited
  Received-Invite:
    Chat: '&a&lINVITED: &7You have been invited to %player%''s property'
    Hover: '&eClick to accept'
    BlobSound: BlobProprietor.Received-Invite
  Leaving:
    Chat: '&c&lLEFT: &7You have left %player%''s party'
  Other-Leaving:
    Chat: '&c&lLEFT: &7%player% has left the party'
  Other-Not-Attending-Party:
    Chat: '&c&lERROR: &7%player% is no longer attending the party'
    BlobSound: System.Alert
  Not-Attending-Party:
    Chat: '&c&lERROR: &7You are not attending a party'
    BlobSound: System.Alert
  Not-Party-Leader:
    Chat: '&c&lERROR: &7You are not the party leader'
    BlobSound: System.Alert
  Party-Leader-Cannot-Leave:
    Chat: '&c&lERROR: &7Party leader cannot leave the party'
    BlobSound: System.Alert
  No-Pending-Invite:
    Chat: '&c&lERROR: &7Invite expired or not found'
    BlobSound: System.Alert
Party:
  Step-In:
    Actionbar: "&7Visiting %player%'s place"
    BlobSound: Property.Door-Open
  Other-Step-In:
    Actionbar: '&7%player% arrived'
    BlobSound: Property.Door-Inside
  Step-Out:
    Actionbar: "&7Leaving %player%'s place"
    BlobSound: Property.Door-Outside
  Other-Step-Out:
    Actionbar: '&7%player% left'
    BlobSound: Property.Door-Closed
  Disbanded:
    Actionbar: '&7Party was disbanded'
